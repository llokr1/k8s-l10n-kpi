name: Refresh PR management hourly
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - uses: ./.github/actions/private-pr-management
        with:
          assignments-repository: ${{ vars.PR_ASSIGNMENTS_REPOSITORY }}
          assignments-token: ${{ secrets.PR_ASSIGNMENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          RESTORE_METRICS: "1"
      - run: npm run build && npm run export:pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - uses: actions/deploy-pages@v5
        id: deployment
