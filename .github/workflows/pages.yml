name: Collect metrics and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_activity_scan:
        description: 전체 기여 이력을 다시 수집합니다. 수 분이 걸리며 GitHub 검색 제한의 영향을 받을 수 있습니다.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Collect GitHub activity
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIVITY_START: "2026-07-11"
          # PR 관리 수집은 별도 액션에서 매번 최신화한다. 일반 배포에서는
          # 이미 검증된 성과 이력을 재사용해 GitHub Search API를 과도하게 호출하지 않는다.
          REUSE_EXISTING_ACTIVITY: ${{ inputs.full_activity_scan && '0' || '1' }}
      - uses: ./.github/actions/private-pr-management
        with:
          assignments-repository: ${{ vars.PR_ASSIGNMENTS_REPOSITORY }}
          assignments-token: ${{ secrets.PR_ASSIGNMENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
      - name: Export static Pages site
        run: npm run export:pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
